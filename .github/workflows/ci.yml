name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. 语法与启动检查
  #    不需要装第三方依赖，所以很快（每个 job 约 20 秒）
  #    Windows 也跑：项目里有 .ps1 / .bat，且 console 编码和 Linux 不同
  # ---------------------------------------------------------------------------
  syntax:
    name: Syntax (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 编译所有 Python 文件
        shell: bash
        run: |
          set -e
          files="app.py pipeline.py check_env.py diarize.py make_icon.py tools/diag_open.py tools/check_links.py"
          for f in $files; do
            echo "::group::py_compile $f"
            python -m py_compile "$f"
            echo "ok"
            echo "::endgroup::"
          done

      # 这一条曾经在 Windows 上失败：英文版控制台的 cp1252 编码打印中文会
      # UnicodeEncodeError，所以 pipeline.py / check_env.py 里都加了
      # stdout.reconfigure(errors="replace") 兜底。这个 job 就是守着它不回归。
      - name: 命令行入口能正常启动
        run: |
          python pipeline.py --help
          python check_env.py --help

  # ---------------------------------------------------------------------------
  # 2. 文档相对链接检查
  #    README 与 docs/ 互相引用较多还引用截图，断链靠肉眼很难发现
  # ---------------------------------------------------------------------------
  links:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Markdown 里的相对链接
        run: python tools/check_links.py
